[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "google-api-utils"
version = "0.2.0"
description = "Utilitários para automação de tarefas no Google Drive e Google Sheets via service account."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8,<3.9"
authors = [{ name = "Bernardo Silva", email = "bernarducs@gmail.com" }]
keywords = ["google-drive", "google-sheets", "automation", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "google-api-python-client>=2.99,<3",
    "google-auth>=2.23,<3",
    "google-auth-httplib2>=0.1.1,<0.3",
    "google-auth-oauthlib>=1.1,<2",
    "pandas>=2.0,<2.1",
    "python-dotenv>=1.0,<2",
    "typer>=0.12,<0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=7,<9",
    "pytest-mock>=3,<4",
    "ruff>=0.5,<1",
]

[project.scripts]
gapi = "google_api_utils.cli:app"

[project.urls]
Repository = "https://github.com/bernardo/google-api-utils"

[tool.hatch.build.targets.wheel]
packages = ["google_api_utils"]

[tool.ruff]
target-version = "py38"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
